name: HostLink CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check site is live
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://hostlink-eta.vercel.app)
          echo "Site status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Site is down!"
            exit 1
          fi
          echo "✅ Site is up!"
